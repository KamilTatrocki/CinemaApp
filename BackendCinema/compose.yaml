services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql

  backend:
    build: .
    ports:
      - '8080:8080'
    volumes:
      - ./uploads:/app/uploads # Mapowanie folderu ze zdjęciami
    depends_on:
      - postgres

volumes:
  postgres_data: